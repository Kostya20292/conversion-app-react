name: Test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: convertly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d convertly" --health-interval 10s --health-timeout
          5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/convertly
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      CORS_ORIGIN: http://127.0.0.1:5173
      STORAGE_ROOT: storage
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/convertly
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          CORS_ORIGIN: http://127.0.0.1:5173
          STORAGE_ROOT: storage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @convertly/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
