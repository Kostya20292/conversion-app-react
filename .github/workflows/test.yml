name: Test

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: convertly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d convertly" --health-interval 10s --health-timeout
          5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/convertly
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      CORS_ORIGIN: http://127.0.0.1:5173
      STORAGE_ROOT: storage
      LIBREOFFICE_DOCKER_IMAGE: convertly-libreoffice:local
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install host LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui fonts-liberation
      - name: Build LibreOffice image
        run: docker compose build libreoffice
      - name: Verify LibreOffice image
        run:
          docker run --rm -e HOME=/tmp -e SAL_USE_VCLPLUGIN=svp convertly-libreoffice:local soffice
          --version
      - name: Smoke-convert DOCX in LibreOffice image
        run: bash scripts/smoke-libreoffice.sh
      - name: Run unit tests
        run: pnpm --filter @convertly/web test && pnpm --filter @convertly/api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/convertly
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          CORS_ORIGIN: http://127.0.0.1:5173
          STORAGE_ROOT: storage
          LIBREOFFICE_DOCKER_IMAGE: convertly-libreoffice:local

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: convertly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d convertly" --health-interval 10s --health-timeout
          5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/convertly
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      CORS_ORIGIN: http://127.0.0.1:5173
      STORAGE_ROOT: storage
      LIBREOFFICE_DOCKER_IMAGE: convertly-libreoffice:local
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install host LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui fonts-liberation
      - name: Build LibreOffice image
        run: docker compose build libreoffice
      - name: Verify LibreOffice image
        run:
          docker run --rm -e HOME=/tmp -e SAL_USE_VCLPLUGIN=svp convertly-libreoffice:local soffice
          --version
      - name: Smoke-convert DOCX in LibreOffice image
        run: bash scripts/smoke-libreoffice.sh
      - run: pnpm --filter @convertly/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
